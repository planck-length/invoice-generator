<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreiraj Glavni Račun</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='invoice_generator.css') }}">
    <style>
        .main-invoice-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .invoice-table th,
        .invoice-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        .invoice-table input {
            width: 100%;
            border: none;
            padding: 5px;
            box-sizing: border-box;
        }

        .header-inputs {
            margin-bottom: 20px;
        }

        .header-inputs label {
            margin-right: 10px;
            font-weight: bold;
        }

        .actions {
            margin-top: 20px;
            text-align: right;
        }

        .btn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="main-invoice-container">
        <a href="{{ url_for('index') }}" class="back-link">&larr; Back to Home</a>
        <h1>Kreiraj Glavni Račun</h1>

        <form action="{{ url_for('export_main_invoice') }}" method="POST">
            <div class="header-inputs">
                <label for="invoice_number">Broj Računa:</label>
                <input type="text" id="invoice_number" name="invoice_number" required>
            </div>

            <table class="invoice-table">
                <thead>
                    <tr>
                        <th style="width: 50px;">Red br.</th>
                        <th>Prezime i ime kupca</th>
                        <th style="width: 120px;">Broj Telefona</th>
                        <th style="width: 100px;">UKUPNO OTPLATA</th>
                        <th style="width: 120px;">M.B</th>
                        <th style="width: 60px;">Broj Rata</th>
                    </tr>
                </thead>
                <tbody id="invoice-body">
                    {% for i in range(1, 26) %}
                    <tr>
                        <td class="row-num">{{ i }}</td>
                        <td><input type="text" name="name_{{ i }}"></td>
                        <td><input type="text" name="phone_{{ i }}"></td>
                        <td><input type="number" step="0.01" name="total_{{ i }}"></td>
                        <td><input type="text" name="mb_{{ i }}"></td>
                        <td><input type="number" name="broj_rata_{{ i }}"></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <div style="margin-top: 10px;">
                <button type="button" id="add-row-btn" class="btn" style="background-color: #2196F3;">Add Row</button>
            </div>

            <div class="actions">
                <button type="submit" class="btn">Generate PDF</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('add-row-btn').addEventListener('click', function () {
            const tbody = document.getElementById('invoice-body');
            const rowCount = tbody.rows.length;
            const newRowIndex = rowCount + 1;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="row-num">${newRowIndex}</td>
                <td><input type="text" name="name_${newRowIndex}"></td>
                <td><input type="text" name="phone_${newRowIndex}"></td>
                <td><input type="number" step="0.01" name="total_${newRowIndex}"></td>
                <td><input type="text" name="mb_${newRowIndex}"></td>
                <td><input type="number" name="broj_rata_${newRowIndex}"></td>
            `;
            tbody.appendChild(tr);
        });
    </script>
</body>

</html>
