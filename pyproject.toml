[tool.poetry]
name = "invoice-generator"
version = "0.1.0"
description = "A Python-based invoice manager with web interface for creating invoices, managing stock, and exporting data"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "invoice_generator"}]
package-mode=false

[tool.poetry.dependencies]
python = "^3.9"
flask = "^3.1.0"
flask-wtf = "^1.2.0"
flask-babel = "^4.0.0"
reportlab = "^4.2.5"
pillow = "^11.0.0"
psycopg2-binary = "^2.9.10"
SQLAlchemy = "^2.0.36"
babel = "^2.16.0"
blinker = "^1.9.0"
chardet = "^5.2.0"
click = "^8.1.8"
greenlet = "^3.1.1"
itsdangerous = "^2.2.0"
Jinja2 = "^3.1.5"
MarkupSafe = "^3.0.2"
python-dateutil = "^2.9.0"
pytz = "^2024.2"
six = "^1.17.0"
typing-extensions = "^4.12.2"
tzdata = "^2024.2"
Werkzeug = "^3.1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-flask = "^1.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=invoice_generator",
    "--cov=stock_manager",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-v"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

